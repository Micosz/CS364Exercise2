name: SQLite and history integration
on:
  push:
    branches: ['test/sqliteandhistory']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Exercise SQLite and history on Android
        shell: bash
        run: |
          mkdir -p build/sqlite-history
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            sdkmanager_bin="$RUNNER_TEMP/android-tools/cmdline-tools/bin/sdkmanager"
          fi
          avdmanager_bin="$(dirname "$sdkmanager_bin")/avdmanager"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          set +o pipefail
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" "$image" emulator platform-tools
          printf 'no\n' | "$avdmanager_bin" create avd --force --name sqliteHistory --package "$image"
          adb start-server
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/emulator/emulator" -avd sqliteHistory -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/sqlite-history/emulator.log 2>&1 &
          emulator_pid=$!
          finish() {
            local result=$?
            if [[ "$result" != 0 ]]; then
              tail -100 build/sqlite-history/emulator.log || true
              timeout 8 adb logcat -d -t 1200 > build/sqlite-history/logcat.txt 2>&1 || true
            fi
            timeout 5 adb emu kill || true
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap finish EXIT
          booted=
          for attempt in {1..75}; do
            kill -0 "$emulator_pid" 2>/dev/null || { echo "Emulator exited before boot"; exit 1; }
            if [[ "$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=yes
              break
            fi
            sleep 2
          done
          [[ "$booted" == yes ]] || { echo "Android did not finish booting"; exit 1; }
          echo "Android emulator is ready"
          adb shell input keyevent 82
          adb shell wm size 720x1280
          adb shell wm density 240
          adb shell settings put system screen_off_timeout 600000
          adb install -g app/build/outputs/apk/debug/app-debug.apk
          python3 .github/scripts/sqlite_history_smoke.py
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-history-diagnostics
          path: build/sqlite-history/
